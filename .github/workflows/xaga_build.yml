name: Tech-Kernel mt6895/xaga (Clean, sin root — test Infinity X)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Checkout mt6895 kernel source (xaga)
        uses: actions/checkout@v4
        with:
          repository: joel27/android_kernel_xiaomi_mt6895
          ref: 16.2-rebase
          fetch-depth: 1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-mt6895-clean-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-mt6895-clean-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex libssl-dev \
            libelf-dev python3 ccache \
            gcc-aarch64-linux-gnu zstd lld llvm-14

      - name: Setup Clang r584948b
        run: |
          mkdir -p clang
          curl -L -o clang.tar.gz \
            "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r584948b-14726520/clang-r584948b.tar.gz"
          tar -xzf clang.tar.gz -C clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          sudo ln -sf /usr/bin/llvm-ar-14      /usr/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-14      /usr/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-14 /usr/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-14 /usr/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-strip-14   /usr/bin/llvm-strip
          clang --version
          ld.lld --version
          ccache --version

      - name: Clean build tree
        run: |
          rm -rf out
          rm -f .config .config.old
          rm -rf include/config include/generated

      - name: Prepare out dir
        run: mkdir -p out

      # Esto sí se mantiene: es específico del hardware (xaga/mt6895), no
      # tiene nada que ver con root. Ya está confirmado que reproduce el
      # mismo merge que tu build exitosa de esk_builder.
      - name: Merge device defconfig fragments (gki + xiaomi_mt6895 + xaga)
        run: |
          scripts/kconfig/merge_config.sh -O out -m \
            arch/arm64/configs/gki_defconfig \
            arch/arm64/configs/vendor/xiaomi_mt6895.config \
            arch/arm64/configs/vendor/xaga.config

      - name: Configure kernel
        run: |
          ./scripts/config --file out/.config \
            --enable  CONFIG_LTO_CLANG \
            --enable  CONFIG_LTO_CLANG_THIN \
            --disable CONFIG_LTO_CLANG_FULL \
            --enable  CONFIG_PSTORE \
            --enable  CONFIG_PSTORE_RAM \
            --enable  CONFIG_PSTORE_CONSOLE \
            --enable  CONFIG_TCP_CONG_BBR \
            --set-str CONFIG_SYSTEM_TRUSTED_KEYS "" \
            --set-str CONFIG_SYSTEM_EXTRA_CERTIFICATE "" \
            --disable CONFIG_SYSTEM_EXTRA_CERTIFICATE \
            --disable CONFIG_INTEGRITY_SIGNATURE \
            --disable CONFIG_IMA_APPRAISE

      - name: Finalize config
        run: |
          make O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel (Image + modules)
        run: |
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            KBUILD_BUILD_TIMESTAMP="$(date -u +'%a %b %d %H:%M:%S UTC %Y')" \
            KBUILD_BUILD_USER="builder" \
            KBUILD_BUILD_HOST="Tech" \
            Image modules 2>&1 | tee build.log

      - name: Install modules to staging
        run: |
          rm -rf modules_staging
          mkdir -p modules_staging
          make -j$(nproc) O=out ARCH=arm64 \
            CC="ccache clang" LLVM=1 LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- \
            INSTALL_MOD_PATH="$PWD/modules_staging" \
            INSTALL_MOD_STRIP=1 \
            modules_install
          mkdir -p modules_flat
          find modules_staging -name "*.ko" -exec cp -f {} modules_flat/ \;
          echo "Módulos generados: $(ls modules_flat | wc -l)"

      - name: Build module.tar.xz (vendor_dlkm)
        run: |
          mkdir -p module_pkg/vendor_dlkm/lib/modules
          cp modules_flat/*.ko module_pkg/vendor_dlkm/lib/modules/
          cd module_pkg
          tar -cJf ../module.tar.xz vendor_dlkm
          cd ..
          echo "module.tar.xz listo: $(ls -la module.tar.xz)"

      - name: Package AnyKernel3 (boot + vendor_boot + vendor_dlkm modules)
        run: |
          git clone --depth=1 \
            https://github.com/ESK-Project/AnyKernel3.git \
            -b generic AnyKernel3
          rm -rf AnyKernel3/config AnyKernel3/modules \
                 AnyKernel3/patch  AnyKernel3/ramdisk
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          zstd -19 --no-progress -q \
            -o AnyKernel3/Image.zst AnyKernel3/Image
          rm AnyKernel3/Image
          cp module.tar.xz AnyKernel3/module.tar.xz

          cat > AnyKernel3/anykernel.sh << 'ANYKERNEL_EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ## cyberknight777 @ xda-developers
          ## bachnxuan @ esk-project
          ## adaptado por joel27 - build limpia (sin root) para test en Infinity X

          ### AnyKernel setup
          properties() { '
          kernel.string=Tech-Kernel mt6895/xaga | Clean (sin root) | test Infinity X
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=xaga
          device.name2=xagain
          device.name3=xagapro
          device.name4=xagaproin
          supported.versions=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install

          BLOCK=boot
          IS_SLOT_DEVICE=1
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto
          NO_MAGISK_CHECK=true

          . tools/ak3-core.sh

          reset_dir() {
              rm -rf "$1" || abort "[!] Failed to reset $1"
              mkdir -p "$1" || abort "[!] Failed to create $1"
          }

          ui_print " " "- [+] Starting kernel image flashing..."
          ui_print "- [*] Checking kernel image..."
          "$BIN/busybox" sha256sum -cs Image.zst.sha256 || abort "[!] SHA256 mismatch"
          ui_print "- [*] SHA256 OK"

          ui_print "- [*] Unpacking kernel image..."
          "$BIN/zstd" -d -q --no-progress -o "$AKHOME/Image" "$AKHOME/Image.zst" ||
              abort "[!] Failed to decompress kernel image"
          ui_print "- [*] Kernel image unpacked"

          ui_print "- [+] Flashing kernel image..."
          split_boot
          if [ -f "$SPLITIMG/ramdisk.cpio" ]; then
              unpack_ramdisk
              write_boot
          else
              flash_boot
          fi

          rm -f "$AKHOME/Image" || abort "[!] Failed to remove extracted Image"

          module_archive="$AKHOME/module.tar.xz"
          module_extract_dir="$AKHOME/_module"

          if [ -f "$module_archive" ]; then
              ui_print " " "- [+] Unpacking module package..."
              reset_dir "$module_extract_dir"
              busybox tar -xpf "$module_archive" -C "$module_extract_dir" ||
                  abort "- [!] Failed to extract module.tar.xz"
          fi

          ## vendor_dlkm install
          if [ -d "$module_extract_dir/vendor_dlkm" ]; then
              reset_ak

              ui_print " " "- [+] Starting /vendor_dlkm modules update..."

              ui_print "- [*] Pulling /vendor_dlkm image from current slot (${SLOT})..."
              dd if=/dev/block/mapper/vendor_dlkm"${SLOT}" of="${AKHOME}"/vendor_dlkm.img ||
                  abort "[!] Failed to pull vendor_dlkm${SLOT}.img"
              extract_vendor_dlkm_dir=${AKHOME}/_extract_vendor_dlkm
              reset_dir "$extract_vendor_dlkm_dir"

              ui_print "- [*] Unpacking /vendor_dlkm image..."
              "${BIN}"/extract.erofs -i "${AKHOME}"/vendor_dlkm.img -x -T8 -o "${extract_vendor_dlkm_dir}" >/dev/null 2>&1 ||
                  abort "[!] Failed to unpack the vendor_dlkm image"
              sync

              # NOTA: a diferencia del script original de ESK, NO se borran ni
              # reemplazan vendor_dlkm_fs_config / vendor_dlkm_file_contexts. Se
              # reutilizan los que ya trae tu vendor_dlkm actual (recien extraidos
              # arriba). Si no estan, se aborta sin tocar nada mas.
              if [ ! -f "${extract_vendor_dlkm_dir}/config/vendor_dlkm_fs_config" ] ||
                 [ ! -f "${extract_vendor_dlkm_dir}/config/vendor_dlkm_file_contexts" ]; then
                  abort "[!] No se encontraron fs_config/file_contexts en el vendor_dlkm actual - abortando"
              fi

              ui_print "- [*] Updating /vendor_dlkm modules..."
              extract_vendor_dlkm_modules_dir=${extract_vendor_dlkm_dir}/vendor_dlkm/lib/modules
              rm -f "${extract_vendor_dlkm_modules_dir}"/* ||
                  abort "[!] Failed to remove pre-existing files in ${extract_vendor_dlkm_modules_dir}"
              cp -a "$module_extract_dir/vendor_dlkm/lib/modules/." "${extract_vendor_dlkm_modules_dir}/" ||
                  abort "[!] Failed to copy vendor_dlkm modules"

              ui_print "- [*] Repacking /vendor_dlkm image..."
              rm -f "${AKHOME}"/vendor_dlkm.img ||
                  abort "[!] Failed to remove pre-existing vendor_dlkm.img"
              "${BIN}"/mkfs.erofs \
                  --mount-point /vendor_dlkm \
                  --fs-config-file "${extract_vendor_dlkm_dir}"/config/vendor_dlkm_fs_config \
                  --file-contexts "${extract_vendor_dlkm_dir}"/config/vendor_dlkm_file_contexts \
                  -z lz4 \
                  -b 4096 \
                  -C 262144 \
                  -T 1230768000 \
                  "${AKHOME}"/vendor_dlkm.img "${extract_vendor_dlkm_dir}"/vendor_dlkm ||
                  abort "[!] Failed to repack the vendor_dlkm image"
              rm -rf "${extract_vendor_dlkm_dir}" ||
                  abort "[!] Failed to remove working directory"
              unset extract_vendor_dlkm_dir extract_vendor_dlkm_modules_dir

              vendor_dlkm_block_size=$(blockdev --getsize64 /dev/block/mapper/vendor_dlkm"${SLOT}")
              if [ "$(wc -c <"$AKHOME"/vendor_dlkm.img)" -lt "${vendor_dlkm_block_size}" ]; then
                  ui_print "- [*] Truncating to fill the erofs image file..."
                  truncate -c -s "$vendor_dlkm_block_size" "$AKHOME"/vendor_dlkm.img
              fi

              ui_print "- [+] Flashing new /vendor_dlkm image..."
              flash_generic vendor_dlkm
          fi

          rm -rf "$module_extract_dir"
          ## end vendor_dlkm install
          ANYKERNEL_EOF

          cd AnyKernel3
          sha256sum Image.zst > Image.zst.sha256
          cd ..
          cd AnyKernel3
          zip -r9 ../Tech-Kernel-mt6895-xaga-Clean.zip . \
            -x ".git*" -x "*.md"

      - name: Upload kernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Tech-Kernel-mt6895-xaga-Clean
          path: Tech-Kernel-mt6895-xaga-Clean.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-mt6895-clean
          path: build.log
